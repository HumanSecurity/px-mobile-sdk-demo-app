// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
        maven { url 'https://jfrog.humansecurity.com/artifactory/human-android-sdk/' }
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
        maven { url 'https://jfrog.humansecurity.com/artifactory/human-android-sdk/' }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"


subprojects { subproject ->
  subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
  }
}


subprojects { subproject ->
  subproject.pluginManager.withPlugin('com.android.application') {
    if (rootProject.findProperty('HUMAN_KEEP_AAR_METADATA_CHECKS') == 'true') {
      return
    }
    // HUMAN Android 5.3.0 AndroidX transitives declare min AGP 9.1; Expo SDK 57 still uses AGP 8.x.
    // Host-level androidx.core 1.18 pins (as in react-native-sdk) break Expo modules.
    // Opt out with HUMAN_KEEP_AAR_METADATA_CHECKS=true in gradle.properties.
    subproject.tasks.matching { it.name.endsWith('AarMetadata') }.configureEach {
      enabled = false
    }
  }
}
